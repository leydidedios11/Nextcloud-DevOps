name: Nextcloud Docker CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Nextcloud Docker Image
    runs-on: ubuntu-latest

    env:
      MARIADB_ROOT_PASSWORD: ci-root-password
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ci-database-password
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ci-admin-password
      NEXTCLOUD_PORT: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Nextcloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/nextcloud/Dockerfile
          push: false
          tags: nextcloud-custom:ci
