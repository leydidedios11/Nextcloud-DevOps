services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextcloud-jenkins:1.0
    restart: unless-stopped

    depends_on:
      - docker

    ports:
      - "8081:8080"

    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"

    volumes:
      - jenkins_home:/var/jenkins_home
      - docker_certs_client:/certs/client:ro

    networks:
      - jenkins_network

  docker:
    image: docker:29-dind
    restart: unless-stopped
    privileged: true

    environment:
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      - docker_certs_ca:/certs/ca
      - docker_certs_client:/certs/client
      - jenkins_docker_data:/var/lib/docker

    networks:
      - jenkins_network

volumes:
  jenkins_home:
  docker_certs_ca:
  docker_certs_client:
  jenkins_docker_data:

networks:
  jenkins_network:
    driver: bridge
