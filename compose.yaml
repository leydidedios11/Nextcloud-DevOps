services:

  db:
    image: mariadb:11.4.9
    container_name: nextcloud-db
    restart: unless-stopped

    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-nextcloud}
      MARIADB_USER: ${MARIADB_USER:-nextcloud}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en .env}

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - nextcloud_network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/nextcloud/Dockerfile

    image: nextcloud-custom:1.0
    container_name: nextcloud-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:${NEXTCLOUD_PORT:-8080}:80"

    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MARIADB_DATABASE:-nextcloud}
      MYSQL_USER: ${MARIADB_USER:-nextcloud}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en .env}

      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Define NEXTCLOUD_ADMIN_PASSWORD en .env}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost

    volumes:
      - nextcloud_data:/var/www/html

    networks:
      - nextcloud_network

volumes:
  mariadb_data:
  nextcloud_data:

networks:
  nextcloud_network:
    driver: bridge
    name: nextcloud_network
